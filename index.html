<body>
<aside class="sidebar" aria-label="儀表板控制">
  <div class="brand"><span class="brand-name">Serenity Tracker</span><span class="brand-mark" aria-hidden="true"></span></div>
  <span class="subtitle">Public-post opinion research, with source evidence.</span>

  <form class="query-form" id="queryForm" role="search">
    <input class="query-input" id="queryInput" type="search" autocomplete="off" placeholder="輸入 SIVE 或問一句話" aria-label="搜尋股票或輸入問題">
    <button class="query-submit" type="submit" aria-label="執行查詢">查</button>
  </form>
  <p class="query-help">例如：AXTI 有哪些風險？／本週偏多股票</p>

  <section class="side-section">
    <span class="side-label">期間</span>
    <nav class="period-nav" id="periodNav" aria-label="時間範圍"></nav>
  </section>

  <section class="side-section">
    <span class="side-label">最新立場</span>
    <div class="filter-grid" id="sentimentFilters"></div>
    <div class="toggle-row"><input id="riskOnly" type="checkbox"><label for="riskOnly">只看有明確風險</label></div>
    <div class="toggle-row"><input id="favoritesOnly" type="checkbox"><label for="favoritesOnly">只看收藏</label></div>
  </section>

  <section class="side-section">
    <label class="side-label" for="sortSelect">排序</label>
    <select class="sort-select" id="sortSelect">
      <option value="latest">最近提及</option>
      <option value="mentions">期間提及次數</option>
      <option value="risk">風險數量</option>
      <option value="ticker">Ticker A–Z</option>
    </select>
  </section>

  <section class="side-section recent-section">
    <span class="side-label">最近查看</span>
    <div class="recent-list" id="recentList"></div>
  </section>

  <section class="side-section data-section">
    <span class="side-label">資料狀態</span>
    <div class="health-card" id="healthPanel"></div>
    <p class="data-note" id="dataNote"></p>
  </section>
</aside>

<main class="main" id="dashboard">
  <header class="main-header">
    <div><div class="eyebrow" id="periodEyebrow"></div><h1 class="page-title" id="pageTitle">Watchlist</h1></div>
    <div class="header-meta" id="headerMeta"></div>
  </header>
  <div class="query-status" id="queryStatus" aria-live="polite"></div>
  <section class="ai-answer" id="aiAnswer" aria-live="polite"></section>
  <section class="stats" id="stats" aria-label="期間摘要"></section>
  <div class="result-bar"><span class="result-count" id="resultCount"></span><button class="clear-button" id="clearFilters" type="button" hidden>清除篩選</button></div>
  <section class="wall" id="cardWall" aria-label="股票清單"></section>
</main>

<section id="detailPage" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="detail-bar">
    <button class="back" id="backButton" type="button">← 返回儀表板</button>
    <div class="detail-actions"><button class="detail-save" id="detailSave" type="button"></button></div>
  </div>
  <div class="detail-shell" id="detailShell"></div>
</section>

<dialog class="review-dialog" id="reviewDialog" aria-labelledby="reviewTitle">
  <form class="review-form" id="reviewForm">
    <div class="review-head">
      <div><h2 class="review-title" id="reviewTitle">人工覆核</h2><div class="review-meta" id="reviewMeta"></div></div>
      <button class="review-close" id="reviewClose" type="button" aria-label="關閉覆核表單">×</button>
    </div>
    <div class="review-grid">
      <div class="review-field"><label for="reviewSentiment">立場</label><select id="reviewSentiment"><option>Bullish</option><option>Bearish</option><option>Neutral</option></select></div>
      <div class="review-field"><label for="reviewReviewer">覆核者</label><input id="reviewReviewer" maxlength="100" value="roger"></div>
      <div class="review-field full"><label for="reviewThesis">論點</label><textarea id="reviewThesis" maxlength="2000" required></textarea></div>
      <div class="review-field full"><label for="reviewEvidence">立場判定依據</label><textarea id="reviewEvidence" maxlength="1000" placeholder="可貼入原文中的直接證據"></textarea></div>
      <div class="review-field full"><label for="reviewRisks">風險</label><textarea id="reviewRisks" maxlength="2000" placeholder="沒有明確風險可留空"></textarea></div>
      <div class="review-field full"><label for="reviewNote">覆核備註</label><textarea id="reviewNote" maxlength="1000" required></textarea></div>
    </div>
    <a class="review-source" id="reviewSource" target="_blank" rel="noopener noreferrer">先查看原文 ↗</a>
    <div class="review-error" id="reviewError" role="alert"></div>
    <div class="review-footer">
      <button class="review-delete" id="reviewDelete" type="button" hidden>移除人工覆核</button>
      <button class="review-cancel" id="reviewCancel" type="button">取消</button>
      <button class="review-save" id="reviewSave" type="submit">儲存覆核</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function button(className, text, onClick) {
  const node = element("button", className, text);
  node.type = "button";
  node.addEventListener("click", onClick);

}

function stanceClass(sentiment) {
  return sentiment === "Bullish" ? "bull" : sentiment === "Bearish" ? "bear" : "neutral";
}

function qualityInfo(status) {
  return qualityMeta[status] || qualityMeta.unverified;
}

function qualityBadge(status, extraClass="") {
  const info = qualityInfo(status);
  const node = element("span", `trust-badge ${status in qualityMeta ? status : "unverified"}${extraClass ? ` ${extraClass}` : ""}`, info.label);
  node.title = info.description;
  return node;
}

function localDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.valueOf()) ? value : date.toLocaleString("zh-TW", {hour12:false});
}

function effectiveHealthStatus() {
  const health = trackerData.health;
  const finishedAt = health.latest_run && health.latest_run.finished_at;
  if (health.status === "healthy" && finishedAt) {
    const age = Date.now() - new Date(finishedAt).valueOf();
    if (Number.isFinite(age) && age > 3 * 60 * 60 * 1000) return "stale";
  }
  return health.status;
}

function renderHealth() {
  const health = trackerData.health;

  const labels = {healthy:"資料正常",running:"管線執行中",partial:"部分失敗",failed:"管線失敗",stale:"資料已過期",unknown:"尚無執行紀錄"};

    details.append(element("div", "", `最後執行：${localDate(run.finished_at || run.started_at)}`));

    details.append(element("div", "", `語意摘要更新 ${run.summaries_updated}｜失敗 ${run.summaries_failed}`));
    if ("prices_updated" in run) details.append(element("div", "", `行情更新 ${run.prices_updated}｜失敗／未支援 ${run.prices_failed}`));
    if (run.long_posts_attempted) details.append(element("div", "", `長文補抓 ${run.long_posts_succeeded}/${run.long_posts_attempted}`));
    if (run.error_message) {
      const issue = issueLabels[run.failure_kind] || run.failed_stage || "pipeline";
      const code = run.failure_code ? ` (${run.failure_code})` : "";
      details.append(element("div", "health-error", `${issue}${code}：${run.error_message}`));
    }
    elements.healthPanel.append(details);
  }
  const coverage = element("div", "health-detail", `語意摘要覆蓋 ${health.semantic_fresh}/${trackerData.tickers.length}；alias 待審核 ${health.alias_candidates_pending}`);
  elements.healthPanel.append(coverage);
}

function readStoredList(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(value) ? value.filter((item) => typeof item === "string") : [];
  } catch (_error) {
    return [];
  }
}

function storeList(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_error) { /* device storage unavailable */ }
}

function readState() {
  const params = new URLSearchParams(location.search);
  const period = params.get("period") || defaults.period;
  const sentiment = params.get("sentiment") || defaults.sentiment;
  const sort = params.get("sort") || defaults.sort;
  const tab = params.get("tab") || defaults.tab;
  const rawTicker = (params.get("ticker") || "").toUpperCase();
  const indexedTicker = tickerIndex.get(rawTicker);
  return {
    period: validPeriods.has(period) ? period : defaults.period,
    sentiment: validSentiments.has(sentiment) ? sentiment : defaults.sentiment,
    risk: params.get("risk") === "1",
    favorites: params.get("favorites") === "1",
    sort: validSorts.has(sort) ? sort : defaults.sort,
    query: params.get("q") || "",
    ticker: indexedTicker ? indexedTicker.ticker : null,
    tab: validTabs.has(tab) ? tab : defaults.tab
  };
}

function writeState({push=false, detail=false}={}) {
  const params = new URLSearchParams();
  if (state.period !== defaults.period) params.set("period", state.period);
  if (state.sentiment !== defaults.sentiment) params.set("sentiment", state.sentiment);
  if (state.risk) params.set("risk", "1");
  if (state.favorites) params.set("favorites", "1");
  if (state.sort !== defaults.sort) params.set("sort", state.sort);
  if (state.query) params.set("q", state.query);
  if (state.ticker) params.set("ticker", state.ticker);
  if (state.ticker && state.tab !== defaults.tab) params.set("tab", state.tab);
  const url = new URL(location.href);
  url.search = params.toString();
  url.hash = "";
  const historyState = detail ? {serenityDetail:true} : {};
  history[push ? "pushState" : "replaceState"](historyState, "", url);
}

function showToast(message) {

}

async function detectReviewMode() {
  try {
    const response = await fetch("api/review/status", {cache:"no-store"});
    if (!response.ok) return;
    const payload = await response.json();
    if (payload.enabled === true && typeof payload.token === "string") {
      reviewMode = {
        enabled:true,
        token:payload.token,
        capabilities:{review:true,market:true,ai:false,...(payload.capabilities || {})}
      };
      elements.queryInput.placeholder = reviewMode.capabilities.ai ? "輸入 ticker 或詢問研究問題" : "輸入 SIVE 或問一句話";
      if (state.ticker) renderDetail();
    }
  } catch (_error) {
    reviewMode = {enabled:false,token:"",capabilities:{review:false,market:false,ai:false}};
  }
}

function reviewButton(post, label=post.has_override ? "編輯覆核" : "人工覆核") {

async function sendReview(path, payload) {
  const response = await fetch(path, {
    method:"POST",
    headers:{"Content-Type":"application/json","X-Review-Token":reviewMode.token},
    body:JSON.stringify(payload)
  });
  const result = await response.json().catch(() => ({error:"本機覆核服務回傳無效內容"}));
  if (!response.ok) throw new Error(result.error || "覆核失敗");
  return result;
}

function clearAIAnswer() {
  elements.aiAnswer.classList.remove("open");
  elements.aiAnswer.replaceChildren();
}

function appendReadableAnswer(container, text) {
  const lines = String(text || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
  let list = null;
  lines.forEach((line) => {
    const bullet = line.match(/^[•*-]\s+(.+)/);
    if (bullet) {
      if (!list) { list = element("ul", "ai-answer-list"); container.append(list); }
      list.append(element("li", "", bullet[1]));
      return;
    }
    list = null;
    const heading = line.match(/^(.{1,32})[：:]$/);
    if (heading) container.append(element("h3", "ai-answer-subhead", heading[1]));
    else container.append(element("p", "ai-answer-paragraph", line));
  });
}

function renderAIAnswer(result, fallbackQuestion="") {
  elements.aiAnswer.replaceChildren();
  elements.aiAnswer.classList.add("open");
  const head = element("div", "ai-answer-head");
  head.append(element("span", "ai-answer-label", "本機 AI · 來源限定問答"));
  head.append(element("span", "ai-answer-status", result.cached ? "快取回答" : "新回答"));
  elements.aiAnswer.append(head);
  const questionBlock = element("div", "ai-question-block");
  questionBlock.append(element("span", "ai-question-label", "你的問題"));
  questionBlock.append(element("div", "ai-question-text", result.question || fallbackQuestion));
  elements.aiAnswer.append(questionBlock);
  const answerBody = element("div", "ai-answer-body");
  appendReadableAnswer(answerBody, result.answer);
  elements.aiAnswer.append(answerBody);
  if (Array.isArray(result.limitations) && result.limitations.length) {
    const limitations = element("div", "ai-limitations");
    limitations.append(element("strong", "", "資料限制："));
    limitations.append(document.createTextNode(result.limitations.join("；")));
    elements.aiAnswer.append(limitations);
  }
  if (Array.isArray(result.citations) && result.citations.length) {
    const uniqueCitations = [];
    const seenSources = new Set();
    result.citations.forEach((citation) => {
      const identity = `${citation.ticker}:${citation.post_id}`;
      if (!seenSources.has(identity)) { seenSources.add(identity); uniqueCitations.push(citation); }
    });
    const groups = new Map();
    uniqueCitations.forEach((citation) => {
      if (!groups.has(citation.ticker)) groups.set(citation.ticker, []);
      groups.get(citation.ticker).push(citation);
    });
    const details = element("details", "ai-sources");
    const groupCounts = [...groups.entries()].map(([ticker, items]) => `${ticker} ${items.length} 篇`).join(" · ");
    details.append(element("summary", "", `查看 ${uniqueCitations.length} 篇原文來源（${groupCounts}）`));
    const sourceGroups = element("div", "ai-source-groups");
    groups.forEach((items, ticker) => {
      const group = element("div", "ai-source-group");
      group.append(element("div", "ai-source-group-title", ticker));
      const citations = element("div", "ai-citations");
      items.forEach((citation) => {
        const label = `${citation.date || "來源"}${citation.url ? " ↗" : ""}`;
        const source = citation.url ? element("a", "ai-citation", label) : element("span", "ai-citation", label);
        if (citation.url) { source.href = citation.url; source.target = "_blank"; source.rel = "noopener noreferrer"; }
        source.title = citation.claim || "來源";
        citations.append(source);
      });
      group.append(citations);
      sourceGroups.append(group);
    });
    details.append(sourceGroups);
    elements.aiAnswer.append(details);
  }
}

async function askAI(question) {
  lastAIQuestion = question;
  clearAIAnswer();
  elements.aiAnswer.classList.add("open");
  const loadingQuestion = element("div", "ai-question-block");
  loadingQuestion.append(element("span", "ai-question-label", "你的問題"));

  try {

    elements.queryInput.value = result.question || question;

    elements.queryStatus.textContent = "AI 問答失敗；規則式搜尋仍可正常使用。";

}

async function saveReviewFromDialog(event) {

  elements.reviewSave.disabled = true;
  elements.reviewDelete.disabled = true;

function currentPeriod() { return trackerData.periods[state.period]; }

function postsInPeriod(ticker) {
  const period = currentPeriod();
  return ticker.posts.filter((post) => post.date >= period.start && post.date <= period.end);
}

function periodSnapshot(ticker) {
  const posts = postsInPeriod(ticker);
  if (!posts.length) return null;
  const sentiments = new Set(posts.map((post) => post.sentiment));
  return {
    ticker,
    posts,
    latest: posts[0],
    mentionCount: posts.length,
    riskCount: posts.filter((post) => Boolean(post.risks)).length,
    stanceChanged: sentiments.size > 1
  };
}

function searchHaystack(snapshot) {
  const ticker = snapshot.ticker;
  return [ticker.ticker,ticker.company_name,ticker.exchange,...ticker.aliases,...ticker.source_tickers,...snapshot.posts.flatMap((post) => [post.thesis,post.risks || "",post.sentiment_evidence || ""])].join(" ").toLocaleLowerCase();
}

function filteredSnapshots() {
  const query = state.query.trim().toLocaleLowerCase();
  const snapshots = trackerData.tickers.map(periodSnapshot).filter(Boolean).filter((snapshot) => {
    if (state.sentiment !== "All" && snapshot.latest.sentiment !== state.sentiment) return false;
    if (state.risk && snapshot.riskCount === 0) return false;
    if (state.favorites && !favorites.includes(snapshot.ticker.ticker)) return false;
    if (query && !searchHaystack(snapshot).includes(query)) return false;
    return true;
  });
  snapshots.sort((left, right) => {
    if (state.sort === "mentions") return right.mentionCount - left.mentionCount || right.latest.timestamp.localeCompare(left.latest.timestamp);
    if (state.sort === "risk") return right.riskCount - left.riskCount || right.latest.timestamp.localeCompare(left.latest.timestamp);
    if (state.sort === "ticker") return left.ticker.ticker.localeCompare(right.ticker.ticker);
    return right.latest.timestamp.localeCompare(left.latest.timestamp) || left.ticker.ticker.localeCompare(right.ticker.ticker);
  });
  return snapshots;
}

function renderControls() {
  elements.periodNav.replaceChildren();

}

function stat(label, value, detail) {
  const node = element("div", "stat");

function renderStats(snapshots) {
  const mentionCount = snapshots.reduce((sum, snapshot) => sum + snapshot.mentionCount, 0);
  const bullish = snapshots.filter((snapshot) => snapshot.latest.sentiment === "Bullish").length;
  const bearish = snapshots.filter((snapshot) => snapshot.latest.sentiment === "Bearish").length;
  const riskCount = snapshots.filter((snapshot) => snapshot.riskCount > 0).length;
  elements.stats.replaceChildren(
    stat("符合股票", snapshots.length, `期間共 ${currentPeriod().ticker_count} 組`),
    stat("提及次數", mentionCount, `${currentPeriod().post_count} 篇來源貼文`),
    stat("最新偏多／偏空", `${bullish}／${bearish}`, "依期間內最後一次立場"),
    stat("有明確風險", riskCount, "只計作者明確指出的風險")
  );
}

function toggleFavorite(ticker) {
  if (favorites.includes(ticker)) {
    favorites = favorites.filter((item) => item !== ticker);
    showToast(`已取消收藏 ${ticker}`);
  } else {
    favorites = [ticker, ...favorites.filter((item) => item !== ticker)];
    showToast(`已收藏 ${ticker}`);
  }
  storeList("serenity:favorites:v1", favorites);
  if (state.favorites) renderDashboard();
  else {
    renderCards(filteredSnapshots());
    if (state.ticker) renderDetail();
  }
}

function renderCards(snapshots) {

    state.tab = "summary";
    writeState();
    hideDetail();

function renderSummary(ticker) {
  const latest = ticker.posts[0];
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "最新摘要"));

function formatReturn(item) {
  if (!item || !Number.isFinite(item.return_pct)) return {value:"—",className:""};
  const value = `${item.return_pct > 0 ? "+" : ""}${item.return_pct.toFixed(2)}%`;
  return {value,className:item.return_pct > 0 ? "positive" : item.return_pct < 0 ? "negative" : ""};
}

function drawMarketChart(canvas, payload) {
  if (!canvas.isConnected || !Array.isArray(payload.series) || payload.series.length < 2) return;
  const bounds = canvas.getBoundingClientRect();
  const width = Math.max(300, Math.round(bounds.width));
  const height = Math.max(220, Math.round(bounds.height));
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  const context = canvas.getContext("2d");
  context.scale(scale, scale);
  const padding = {top:24,right:20,bottom:31,left:52};
  const plotWidth = width - padding.left - padding.right;
  const plotHeight = height - padding.top - padding.bottom;
  const values = payload.series.map((point) => Number(point.close));
  let minimum = Math.min(...values);
  let maximum = Math.max(...values);
  if (minimum === maximum) { minimum *= .99; maximum *= 1.01; }
  const range = maximum - minimum;
  minimum -= range * .06;
  maximum += range * .06;
  const x = (index) => padding.left + (index / (payload.series.length - 1)) * plotWidth;
  const y = (value) => padding.top + ((maximum - value) / (maximum - minimum)) * plotHeight;
  context.strokeStyle = "#ddd6c8";
  context.fillStyle = "#8c8579";
  context.font = "10px system-ui";
  context.lineWidth = 1;
  for (let row = 0; row <= 4; row += 1) {
    const currentY = padding.top + (row / 4) * plotHeight;
    context.beginPath(); context.moveTo(padding.left,currentY); context.lineTo(width-padding.right,currentY); context.stroke();
    const price = maximum - (row / 4) * (maximum - minimum);
    context.fillText(price.toFixed(price >= 100 ? 0 : 2), 5, currentY + 3);
  }
  context.strokeStyle = "#1f5c4d";
  context.lineWidth = 2;
  context.beginPath();
  payload.series.forEach((point,index) => {
    if (index === 0) context.moveTo(x(index), y(Number(point.close)));
    else context.lineTo(x(index), y(Number(point.close)));
  });
  context.stroke();
  payload.markers.forEach((marker) => {
    let index = payload.series.findIndex((point) => point.date >= marker.date);
    if (index < 0) index = payload.series.length - 1;
    context.fillStyle = marker.sentiment === "Bullish" ? "#147348" : marker.sentiment === "Bearish" ? "#ad3d2f" : "#766f63";
    context.beginPath(); context.arc(x(index), y(Number(payload.series[index].close)), 4, 0, Math.PI * 2); context.fill();
  });
  context.fillStyle = "#8c8579";
  context.fillText(payload.series[0].date, padding.left, height - 9);
  const lastDate = payload.series[payload.series.length - 1].date;
  const lastWidth = context.measureText(lastDate).width;
  context.fillText(lastDate, width - padding.right - lastWidth, height - 9);
}

function findTickersInQuestion(question) {
  const upper = question.toUpperCase();
  const matches = [];
  const seen = new Set();
  [...tickerIndex.keys()].sort((left, right) => right.length - left.length).forEach((alias) => {
    const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp(`(^|[^A-Z0-9.])${escaped}(?=$|[^A-Z0-9.])`).test(upper)) {
      const ticker = tickerIndex.get(alias);
      if (ticker && !seen.has(ticker.ticker)) { seen.add(ticker.ticker); matches.push(ticker); }
    }
  });
  return matches;
}

function interpretQuestion(rawQuestion) {
  const question = rawQuestion.trim();
  if (!question) return;
  clearAIAnswer();
  const lower = question.toLocaleLowerCase();
  let detectedPeriod = null;
  if (/今天|今日|日報|daily/.test(lower)) detectedPeriod = "day";
  else if (/本週|這週|一週|週報|weekly|week/.test(lower)) detectedPeriod = "week";
  else if (/本月|這月|月報|monthly|month/.test(lower)) detectedPeriod = "month";
  else if (/本季|這季|季報|quarterly|quarter/.test(lower)) detectedPeriod = "quarter";
  if (detectedPeriod) state.period = detectedPeriod;

  const mentionedTickers = findTickersInQuestion(question);
  const ticker = mentionedTickers.length === 1 ? mentionedTickers[0] : null;
  const asksRisk = /風險|疑慮|risk|downside/.test(lower);
  const asksComplex = /比較|差異|為什麼|原因|根據|如何|怎麼|趨勢|演變|綜合|最值得|是否|合理|compare|why|how/.test(lower) || mentionedTickers.length > 1;
  if (ticker && !asksComplex) {
    state.query = "";
    elements.queryInput.value = "";
    elements.queryStatus.textContent = `已開啟 ${ticker.ticker}${asksRisk ? " 的風險整理" : " 個股研究"}`;
    openDetail(ticker.ticker, asksRisk ? "risks" : "summary", elements.queryInput);
    return;
  }

  let sentiment = null;
  if (/偏多|看多|多頭|bullish/.test(lower)) sentiment = "Bullish";
  else if (/偏空|看空|空頭|bearish/.test(lower)) sentiment = "Bearish";
  else if (/中立|neutral/.test(lower)) sentiment = "Neutral";
  if (sentiment && !asksComplex) {
    state.sentiment = sentiment;
    state.query = "";
    state.risk = asksRisk;
    elements.queryStatus.textContent = `已顯示${currentPeriod().label}期最新立場為${sentiment === "Bullish" ? "偏多" : sentiment === "Bearish" ? "偏空" : "中立"}的股票`;
  } else if (/收藏|自選|favorite|watchlist/.test(lower)) {
    state.favorites = true;
    state.query = "";
    elements.queryStatus.textContent = "已顯示收藏股票";
  } else if (reviewMode.enabled && reviewMode.capabilities.ai) {
    state.query = "";
    writeState();
    renderDashboard();
    askAI(question);
    return;
  } else {
    state.query = question;
    elements.queryStatus.textContent = `正在搜尋「${question}」`;
  }
  writeState();
  renderDashboard();
}

  if (event.key === "/" && !state.ticker && document.activeElement !== elements.queryInput) {
    event.preventDefault(); elements.queryInput.focus();
  }
});
window.addEventListener("popstate", () => {
  state = readState();
  if (state.ticker) renderDetail(); else { hideDetail(); renderDashboard(); }
});

renderDashboard();
if (state.ticker) renderDetail();
detectReviewMode();
</script>
</body>
</html>
