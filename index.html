<aside class="sidebar" aria-label="儀表板控制">
  <div class="brand"><span class="brand-name">Serenity Tracker</span><span class="brand-mark" aria-hidden="true"></span></div>
  <span class="subtitle">Public-post opinion research, with source evidence.</span>

    <input class="query-input" id="queryInput" type="search" autocomplete="off" placeholder="輸入 SIVE 或問一句話" aria-label="搜尋股票或輸入問題">
    <button class="query-submit" type="submit" aria-label="執行查詢">查</button>
  </form>
  <p class="query-help">例如：AXTI 有哪些風險？／本週偏多股票</p>

  <section class="side-section">
    <span class="side-label">期間</span>
    <nav class="period-nav" id="periodNav" aria-label="時間範圍"></nav>
  </section>

  <section class="side-section">
    <span class="side-label">最新立場</span>
    <div class="filter-grid" id="sentimentFilters"></div>
    <div class="toggle-row"><input id="riskOnly" type="checkbox"><label for="riskOnly">只看有明確風險</label></div>
    <div class="toggle-row"><input id="favoritesOnly" type="checkbox"><label for="favoritesOnly">只看收藏</label></div>
  </section>

  <section class="side-section">
    <label class="side-label" for="sortSelect">排序</label>
    <select class="sort-select" id="sortSelect">
      <option value="latest">最近提及</option>
      <option value="mentions">期間提及次數</option>
      <option value="risk">風險數量</option>
      <option value="ticker">Ticker A–Z</option>
    </select>
  </section>

  <section class="side-section recent-section">
    <span class="side-label">最近查看</span>
    <div class="recent-list" id="recentList"></div>
  </section>

  <section class="side-section data-section">
    <span class="side-label">資料狀態</span>
    <p class="data-note" id="dataNote"></p>
  </section>
</aside>

<main class="main" id="dashboard">
  <header class="main-header">
    <div><div class="eyebrow" id="periodEyebrow"></div><h1 class="page-title" id="pageTitle">Watchlist</h1></div>
    <div class="header-meta" id="headerMeta"></div>
  </header>
  <div class="query-status" id="queryStatus" aria-live="polite"></div>
  <section class="stats" id="stats" aria-label="期間摘要"></section>
  <div class="result-bar"><span class="result-count" id="resultCount"></span><button class="clear-button" id="clearFilters" type="button" hidden>清除篩選</button></div>
  <section class="wall" id="cardWall" aria-label="股票清單"></section>
</main>

<section id="detailPage" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="detail-bar">
    <button class="back" id="backButton" type="button">← 返回儀表板</button>
    <div class="detail-actions"><button class="detail-save" id="detailSave" type="button"></button></div>
  </div>
  <div class="detail-shell" id="detailShell"></div>
</section>

<script>
"use strict";
const trackerData = JSON.parse(document.getElementById("trackerData").textContent);
const elements = {
  periodNav: document.getElementById("periodNav"),
  sentimentFilters: document.getElementById("sentimentFilters"),
  riskOnly: document.getElementById("riskOnly"),
  favoritesOnly: document.getElementById("favoritesOnly"),
  sortSelect: document.getElementById("sortSelect"),
  recentList: document.getElementById("recentList"),
  dataNote: document.getElementById("dataNote"),
  queryForm: document.getElementById("queryForm"),
  queryInput: document.getElementById("queryInput"),
  queryStatus: document.getElementById("queryStatus"),
  periodEyebrow: document.getElementById("periodEyebrow"),
  pageTitle: document.getElementById("pageTitle"),
  headerMeta: document.getElementById("headerMeta"),
  stats: document.getElementById("stats"),
  resultCount: document.getElementById("resultCount"),
  clearFilters: document.getElementById("clearFilters"),
  cardWall: document.getElementById("cardWall"),
  detailPage: document.getElementById("detailPage"),
  detailShell: document.getElementById("detailShell"),
  backButton: document.getElementById("backButton"),
  detailSave: document.getElementById("detailSave"),
  toast: document.getElementById("toast")
};
const defaults = {period:"day",sentiment:"All",risk:false,favorites:false,sort:"latest",query:"",ticker:null,tab:"summary"};
const validPeriods = new Set(Object.keys(trackerData.periods));
const validSentiments = new Set(["All","Bullish","Bearish","Neutral"]);
const validSorts = new Set(["latest","mentions","risk","ticker"]);
const validTabs = new Set(["summary","evolution","key","risks","history"]);
const qualityMeta = {
  manual: {
    label: "人工覆核",
    description: "此筆結果已由人工確認，顯示內容會優先於模型輸出。"
  },
  verified: {
    label: "證據已核對",
    description: "新版分析附有來源文字中的逐字依據；仍建議閱讀原文確認完整脈絡。"
  },
  legacy: {
    label: "舊資料未驗證",
    description: "此筆來自舊版分析，沒有逐字立場證據，請勿只依賴多空標籤。"
  },
  unverified: {
    label: "待覆核",
    description: "此筆沒有可顯示的逐字立場證據，請先閱讀原文。"
  }
};
const tickerIndex = new Map();
trackerData.tickers.forEach((ticker) => {
  tickerIndex.set(ticker.ticker.toUpperCase(), ticker);
  ticker.aliases.forEach((alias) => tickerIndex.set(alias.toUpperCase(), ticker));
});
let state = readState();
let favorites = readStoredList("serenity:favorites:v1");
let recent = readStoredList("serenity:recent:v1");
let lastFocused = null;
let toastTimer = null;

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function button(className, text, onClick) {
  const node = element("button", className, text);
  node.type = "button";
  node.addEventListener("click", onClick);
  return node;
}

function stanceClass(sentiment) {
  return sentiment === "Bullish" ? "bull" : sentiment === "Bearish" ? "bear" : "neutral";
}

function qualityInfo(status) {
  return qualityMeta[status] || qualityMeta.unverified;
}

function qualityBadge(status, extraClass="") {
  const info = qualityInfo(status);
  const node = element("span", `trust-badge ${status in qualityMeta ? status : "unverified"}${extraClass ? ` ${extraClass}` : ""}`, info.label);
  node.title = info.description;
  return node;
}

function localDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.valueOf()) ? value : date.toLocaleString("zh-TW", {hour12:false});
}

function readStoredList(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(value) ? value.filter((item) => typeof item === "string") : [];
  } catch (_error) {
    return [];
  }
}

function storeList(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_error) { /* device storage unavailable */ }
}

function readState() {
  const params = new URLSearchParams(location.search);
  const period = params.get("period") || defaults.period;
  const sentiment = params.get("sentiment") || defaults.sentiment;
  const sort = params.get("sort") || defaults.sort;
  const tab = params.get("tab") || defaults.tab;
  const rawTicker = (params.get("ticker") || "").toUpperCase();
  const indexedTicker = tickerIndex.get(rawTicker);
  return {
    period: validPeriods.has(period) ? period : defaults.period,
    sentiment: validSentiments.has(sentiment) ? sentiment : defaults.sentiment,
    risk: params.get("risk") === "1",
    favorites: params.get("favorites") === "1",
    sort: validSorts.has(sort) ? sort : defaults.sort,
    query: params.get("q") || "",
    ticker: indexedTicker ? indexedTicker.ticker : null,
    tab: validTabs.has(tab) ? tab : defaults.tab
  };
}

function writeState({push=false, detail=false}={}) {
  const params = new URLSearchParams();
  if (state.period !== defaults.period) params.set("period", state.period);
  if (state.sentiment !== defaults.sentiment) params.set("sentiment", state.sentiment);
  if (state.risk) params.set("risk", "1");
  if (state.favorites) params.set("favorites", "1");
  if (state.sort !== defaults.sort) params.set("sort", state.sort);
  if (state.query) params.set("q", state.query);
  if (state.ticker) params.set("ticker", state.ticker);
  if (state.ticker && state.tab !== defaults.tab) params.set("tab", state.tab);
  const url = new URL(location.href);
  url.search = params.toString();
  url.hash = "";
  const historyState = detail ? {serenityDetail:true} : {};
  history[push ? "pushState" : "replaceState"](historyState, "", url);
}

function showToast(message) {
  elements.toast.textContent = message;
  elements.toast.classList.add("show");
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => elements.toast.classList.remove("show"), 1800);
}

function currentPeriod() { return trackerData.periods[state.period]; }

function postsInPeriod(ticker) {
  const period = currentPeriod();
  return ticker.posts.filter((post) => post.date >= period.start && post.date <= period.end);
}

function periodSnapshot(ticker) {
  const posts = postsInPeriod(ticker);
  if (!posts.length) return null;
  const sentiments = new Set(posts.map((post) => post.sentiment));
  return {
    ticker,
    posts,
    latest: posts[0],
    mentionCount: posts.length,
    riskCount: posts.filter((post) => Boolean(post.risks)).length,
    stanceChanged: sentiments.size > 1
  };
}

function searchHaystack(snapshot) {
  const ticker = snapshot.ticker;
  return [ticker.ticker,ticker.company_name,ticker.exchange,...ticker.aliases,...ticker.source_tickers,...snapshot.posts.flatMap((post) => [post.thesis,post.risks || "",post.sentiment_evidence || ""])].join(" ").toLocaleLowerCase();
}

function filteredSnapshots() {
  const query = state.query.trim().toLocaleLowerCase();
  const snapshots = trackerData.tickers.map(periodSnapshot).filter(Boolean).filter((snapshot) => {
    if (state.sentiment !== "All" && snapshot.latest.sentiment !== state.sentiment) return false;
    if (state.risk && snapshot.riskCount === 0) return false;
    if (state.favorites && !favorites.includes(snapshot.ticker.ticker)) return false;
    if (query && !searchHaystack(snapshot).includes(query)) return false;
    return true;
  });
  snapshots.sort((left, right) => {
    if (state.sort === "mentions") return right.mentionCount - left.mentionCount || right.latest.timestamp.localeCompare(left.latest.timestamp);
    if (state.sort === "risk") return right.riskCount - left.riskCount || right.latest.timestamp.localeCompare(left.latest.timestamp);
    if (state.sort === "ticker") return left.ticker.ticker.localeCompare(right.ticker.ticker);
    return right.latest.timestamp.localeCompare(left.latest.timestamp) || left.ticker.ticker.localeCompare(right.ticker.ticker);
  });
  return snapshots;
}

function renderControls() {
  elements.periodNav.replaceChildren();
  Object.entries(trackerData.periods).forEach(([key, period]) => {
    const node = button(`period-button${state.period === key ? " active" : ""}`, `${period.label} ${period.ticker_count}`, () => {
      state.period = key;
      state.query = "";
      elements.queryStatus.textContent = "";
      writeState();
      renderDashboard();
    });
    node.setAttribute("aria-pressed", String(state.period === key));
    elements.periodNav.append(node);
  });

  elements.sentimentFilters.replaceChildren();
  [["All","全部"],["Bullish","偏多"],["Bearish","偏空"],["Neutral","中立"]].forEach(([value,label]) => {
    const extra = value === "Bullish" ? " bull" : value === "Bearish" ? " bear" : "";
    const node = button(`filter-button${extra}${state.sentiment === value ? " active" : ""}`, label, () => {
      state.sentiment = value;
      writeState();
      renderDashboard();
    });
    node.setAttribute("aria-pressed", String(state.sentiment === value));
    elements.sentimentFilters.append(node);
  });
  elements.riskOnly.checked = state.risk;
  elements.favoritesOnly.checked = state.favorites;
  elements.sortSelect.value = state.sort;
  elements.queryInput.value = state.query;
}

function renderRecent() {
  elements.recentList.replaceChildren();
  const available = recent.map((ticker) => trackerData.tickers.find((item) => item.ticker === ticker)).filter(Boolean).slice(0, 7);
  if (!available.length) {
    elements.recentList.append(element("span", "empty-recent", "尚未查看個股"));
    return;
  }
  available.forEach((ticker) => {
    const node = button("recent-button", null, () => openDetail(ticker.ticker, "summary", node));
    node.append(element("span", "recent-ticker", ticker.ticker));
    node.append(element("span", "recent-date", ticker.latest_date));
    elements.recentList.append(node);
  });
}

function stat(label, value, detail) {
  const node = element("div", "stat");
  node.append(element("div", "stat-label", label));
  node.append(element("div", "stat-value", String(value)));
  node.append(element("div", "stat-detail", detail));
  return node;
}

function renderStats(snapshots) {
  const mentionCount = snapshots.reduce((sum, snapshot) => sum + snapshot.mentionCount, 0);
  const bullish = snapshots.filter((snapshot) => snapshot.latest.sentiment === "Bullish").length;
  const bearish = snapshots.filter((snapshot) => snapshot.latest.sentiment === "Bearish").length;
  const riskCount = snapshots.filter((snapshot) => snapshot.riskCount > 0).length;
  elements.stats.replaceChildren(
    stat("符合股票", snapshots.length, `期間共 ${currentPeriod().ticker_count} 組`),
    stat("提及次數", mentionCount, `${currentPeriod().post_count} 篇來源貼文`),
    stat("最新偏多／偏空", `${bullish}／${bearish}`, "依期間內最後一次立場"),
    stat("有明確風險", riskCount, "只計作者明確指出的風險")
  );
}

function toggleFavorite(ticker) {
  if (favorites.includes(ticker)) {
    favorites = favorites.filter((item) => item !== ticker);
    showToast(`已取消收藏 ${ticker}`);
  } else {
    favorites = [ticker, ...favorites.filter((item) => item !== ticker)];
    showToast(`已收藏 ${ticker}`);
  }
  storeList("serenity:favorites:v1", favorites);
  if (state.favorites) renderDashboard();
  else {
    renderCards(filteredSnapshots());
    if (state.ticker) renderDetail();
  }
}

function renderCard(snapshot) {
  const ticker = snapshot.ticker;
  const card = element("article", "card");
  const star = button(`star-button${favorites.includes(ticker.ticker) ? " saved" : ""}`, favorites.includes(ticker.ticker) ? "★" : "☆", (event) => {
    event.stopPropagation();
    toggleFavorite(ticker.ticker);
  });
  star.setAttribute("aria-label", `${favorites.includes(ticker.ticker) ? "取消收藏" : "收藏"} ${ticker.ticker}`);
  card.append(star);

  const main = button("card-main", null, () => openDetail(ticker.ticker, "summary", main));
  main.setAttribute("aria-label", `查看 ${ticker.ticker} 個股研究`);
  const head = element("div", "card-head");
  const tickerLine = element("div", "ticker-line");
  tickerLine.append(element("span", "tk", ticker.ticker));
  if (ticker.company_name) tickerLine.append(element("span", "company", ticker.company_name));
  head.append(tickerLine);
  head.append(element("span", `badge ${stanceClass(snapshot.latest.sentiment)}`, snapshot.latest.sentiment));
  main.append(head);
  main.append(qualityBadge(snapshot.latest.quality_status, "card-trust"));
  main.append(element("div", "csumm", snapshot.latest.thesis));
  const foot = element("div", "card-foot");
  foot.append(element("div", "latest", `Latest ${snapshot.latest.date}`));
  const metrics = element("div", "mini-metrics");
  metrics.append(element("span", "", `${snapshot.mentionCount} mentions`));
  if (snapshot.riskCount) metrics.append(element("span", "", `${snapshot.riskCount} risks`));
  if (snapshot.stanceChanged) metrics.append(element("span", "flip", "立場變化"));
  foot.append(metrics);
  main.append(foot);
  card.append(main);
  return card;
}

function renderCards(snapshots) {
  elements.cardWall.replaceChildren();
  if (!snapshots.length) {
    elements.cardWall.append(element("div", "empty", "目前篩選條件沒有符合的股票。試著切換期間或清除篩選。"));
    return;
  }
  snapshots.forEach((snapshot) => elements.cardWall.append(renderCard(snapshot)));
}

function hasFilters() {
  return state.sentiment !== "All" || state.risk || state.favorites || state.query || state.sort !== "latest";
}

function renderDashboard() {
  renderControls();
  renderRecent();
  const period = currentPeriod();
  const snapshots = filteredSnapshots();
  elements.periodEyebrow.textContent = `${period.start} — ${period.end}`;
  elements.pageTitle.textContent = period.title;
  elements.headerMeta.textContent = `資料截止 ${trackerData.dataset_end}\nGenerated ${localDate(trackerData.generated_at)}`;
  elements.headerMeta.style.whiteSpace = "pre-line";
  const quality = trackerData.quality_totals;
  elements.dataNote.textContent = `涵蓋 ${trackerData.dataset_start} 至 ${trackerData.dataset_end}；alias 合併後共 ${trackerData.tickers.length} 組股票。\n人工覆核 ${quality.manual}、證據已核對 ${quality.verified}、舊資料未驗證 ${quality.legacy}、待覆核 ${quality.unverified}。`;
  elements.dataNote.style.whiteSpace = "pre-line";
  renderStats(snapshots);
  elements.resultCount.textContent = `顯示 ${snapshots.length} 組股票`;
  elements.clearFilters.hidden = !hasFilters();
  renderCards(snapshots);
}

function addRecent(ticker) {
  recent = [ticker, ...recent.filter((item) => item !== ticker)].slice(0, 10);
  storeList("serenity:recent:v1", recent);
}

function openDetail(ticker, tab="summary", trigger=null) {
  const target = tickerIndex.get(ticker.toUpperCase());
  if (!target) return;
  lastFocused = trigger || document.activeElement;
  state.ticker = target.ticker;
  state.tab = validTabs.has(tab) ? tab : "summary";
  addRecent(target.ticker);
  writeState({push:true, detail:true});
  renderDetail();
}

function closeDetail() {
  if (!state.ticker) return;
  if (history.state && history.state.serenityDetail) {
    history.back();
  } else {
    state.ticker = null;
    state.tab = "summary";
    writeState();
    hideDetail();
  }
}

function hideDetail() {
  elements.detailPage.classList.remove("open");
  elements.detailShell.replaceChildren();
  document.body.style.overflow = "";
  renderRecent();
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function detailMetric(value, label) {
  const node = element("div", "detail-metric");
  node.append(element("div", "detail-metric-value", String(value)));
  node.append(element("div", "detail-metric-label", label));
  return node;
}

function sourceLink(post, label="查看原文 ↗") {
  if (!post.url) return null;
  const link = element("a", "source", label);
  link.href = post.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function trustNotice(post) {
  const info = qualityInfo(post.quality_status);
  const notice = element("div", "trust-notice");
  const head = element("div", "trust-notice-head");
  head.append(qualityBadge(post.quality_status));
  if (post.has_override && post.reviewed_at) {
    head.append(element("span", "latest", `${post.reviewer || "manual"} · ${localDate(post.reviewed_at)}`));
  }
  notice.append(head);
  notice.append(element("div", "trust-notice-text", info.description));
  if (post.has_override && post.review_note) {
    notice.append(element("div", "review-note", `覆核備註：${post.review_note}`));
  }
  return notice;
}

function renderSummary(ticker) {
  const latest = ticker.posts[0];
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "最新摘要"));
  const panel = element("section", "latest-panel");
  const head = element("div", "latest-panel-head");
  head.append(element("span", `badge ${stanceClass(latest.sentiment)}`, latest.sentiment));
  head.append(element("span", "latest", latest.date));
  panel.append(head);
  panel.append(element("div", "latest-thesis", latest.thesis));
  panel.append(trustNotice(latest));
  if (latest.sentiment_evidence) {
    const evidence = element("div", "evidence");
    evidence.append(element("span", "evidence-label", "立場判定依據"));
    evidence.append(document.createTextNode(latest.sentiment_evidence));
    panel.append(evidence);
  }
  const link = sourceLink(latest);
  if (link) panel.append(link);
  const distribution = element("div", "distribution");
  [["Bullish","偏多"],["Bearish","偏空"],["Neutral","中立"]].forEach(([key,label]) => {
    const item = element("div", "distribution-item");
    item.append(element("div", "distribution-number", ticker.sentiment_counts[key]));
    item.append(element("div", "distribution-label", `${label}歷史紀錄`));
    distribution.append(item);
  });
  panel.append(distribution);
  fragment.append(panel);
  return fragment;
}

function renderEvolution(ticker) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "論點演變"));
  const timeline = element("div", "timeline");
  ticker.evolution.forEach((event) => {
    const item = element("article", "timeline-item");
    const top = element("div", "timeline-top");
    top.append(element("span", "timeline-type", event.change_type));
    const eventMeta = element("div", "post-meta-left");
    eventMeta.append(qualityBadge(event.quality_status));
    eventMeta.append(element("span", "timeline-date", `${event.date} · ${event.sentiment}`));
    top.append(eventMeta);
    item.append(top);
    item.append(element("div", "timeline-summary", event.change_summary));
    item.append(element("div", "timeline-thesis", event.thesis));
    const link = sourceLink(event);
    if (link) item.append(link);
    timeline.append(item);
  });
  fragment.append(timeline);
  return fragment;
}

function renderKeyPoints(ticker) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "3 個關鍵觀點"));
  const grid = element("div", "key-grid");
  ticker.key_points.forEach((point) => {
    const card = element("article", "key-card");
    card.append(element("div", "key-why", point.why));
    const pointMeta = element("div", "key-meta");
    pointMeta.append(qualityBadge(point.quality_status));
    pointMeta.append(element("div", "key-date", `${point.date} · ${point.sentiment}`));
    card.append(pointMeta);
    card.append(element("div", "key-thesis", point.thesis));
    const link = sourceLink(point);
    if (link) card.append(link);
    grid.append(card);
  });
  fragment.append(grid);
  return fragment;
}

function renderRisks(ticker) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "作者曾明確提到的風險"));
  if (!ticker.risk_groups.length) {
    fragment.append(element("div", "no-data", "目前沒有找到作者對這檔股票明確指出的風險。這不代表股票沒有風險。"));
    return fragment;
  }
  const list = element("div", "risk-list");
  ticker.risk_groups.forEach((risk) => {
    const card = element("article", "risk-card");
    const head = element("div", "risk-head");
    head.append(element("div", "risk-name", risk.risk));
    head.append(element("span", "risk-count", `${risk.count} 次`));
    card.append(head);
    card.append(element("div", "risk-dates", `${risk.first_date} — ${risk.last_date}`));
    const sources = element("div", "risk-sources");
    risk.occurrences.forEach((occurrence) => {
      const link = sourceLink(occurrence, `${occurrence.date} ↗`);
      if (link) { link.className = "risk-source"; sources.append(link); }
    });
    card.append(sources);
    list.append(card);
  });
  fragment.append(list);
  return fragment;
}

function renderHistory(ticker) {
  const fragment = document.createDocumentFragment();
  fragment.append(element("h2", "section-title", "完整來源紀錄"));
  const list = element("div", "history-list");
  ticker.posts.forEach((post) => {
    const article = element("article", "post");
    const meta = element("div", "post-meta");
    const metaLeft = element("div", "post-meta-left");
    metaLeft.append(element("span", `badge ${stanceClass(post.sentiment)}`, post.sentiment));
    metaLeft.append(qualityBadge(post.quality_status));
    meta.append(metaLeft);
    const dateText = post.source_ticker !== ticker.ticker ? `${post.date} · 原始代碼 ${post.source_ticker}` : post.date;
    meta.append(element("span", post.source_ticker !== ticker.ticker ? "source-ticker" : "", dateText));
    article.append(meta);
    const thesis = element("div", "post-text");
    thesis.append(element("span", "label", "【論點】\n"));
    thesis.append(document.createTextNode(post.thesis));
    article.append(thesis);
    if (post.sentiment_evidence) {
      const evidence = element("div", "post-text post-evidence");
      evidence.append(element("span", "label", "【立場判定依據】\n"));
      evidence.append(document.createTextNode(post.sentiment_evidence));
      article.append(evidence);
    }
    const risk = element("div", "post-text risk-text");
    risk.append(element("span", "label", "【風險】\n"));
    risk.append(document.createTextNode(post.risks || "未提及"));
    article.append(risk);
    if (post.has_override && post.review_note) {
      article.append(element("div", "post-review", `人工覆核：${post.review_note}`));
    }
    const link = sourceLink(post);
    if (link) article.append(link);
    list.append(article);
  });
  fragment.append(list);
  return fragment;
}

function renderDetail() {
  const ticker = trackerData.tickers.find((item) => item.ticker === state.ticker);
  if (!ticker) { hideDetail(); return; }
  elements.detailShell.replaceChildren();
  const heading = element("header", "detail-heading");
  const titleBlock = element("div");
  const title = element("h1", "detail-title", ticker.ticker);
  title.id = "detailTitle";
  titleBlock.append(title);
  if (ticker.company_name) titleBlock.append(element("p", "detail-company", `${ticker.company_name}${ticker.exchange ? ` · ${ticker.exchange}` : ""}`));
  const aliasText = ticker.aliases.filter((alias) => alias !== ticker.ticker);
  if (aliasText.length) titleBlock.append(element("div", "detail-aliases", `Aliases: ${aliasText.join(", ")}`));
  heading.append(titleBlock);
  heading.append(element("span", `badge detail-badge ${stanceClass(ticker.latest_sentiment)}`, ticker.latest_sentiment));
  elements.detailShell.append(heading);

  const metrics = element("section", "detail-metrics", null);
  metrics.append(detailMetric(ticker.mention_count, "歷史提及"));
  metrics.append(detailMetric(ticker.first_date, "首次提及"));
  metrics.append(detailMetric(ticker.latest_date, "最近提及"));
  metrics.append(detailMetric(ticker.risk_groups.length, "風險主題"));
  elements.detailShell.append(metrics);

  const tabs = element("nav", "tabs");
  tabs.setAttribute("role", "tablist");
  [["summary","最新摘要"],["evolution","論點演變"],["key","關鍵觀點"],["risks","風險"],["history","完整紀錄"]].forEach(([value,label]) => {
    const tab = button(`tab-button${state.tab === value ? " active" : ""}`, label, () => {
      state.tab = value;
      writeState();
      renderDetail();
    });
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(state.tab === value));
    tabs.append(tab);
  });
  elements.detailShell.append(tabs);
  const content = element("div", "detail-content");
  if (state.tab === "evolution") content.append(renderEvolution(ticker));
  else if (state.tab === "key") content.append(renderKeyPoints(ticker));
  else if (state.tab === "risks") content.append(renderRisks(ticker));
  else if (state.tab === "history") content.append(renderHistory(ticker));
  else content.append(renderSummary(ticker));
  elements.detailShell.append(content);

  const saved = favorites.includes(ticker.ticker);
  elements.detailSave.textContent = saved ? "★ 已收藏" : "☆ 收藏";
  elements.detailSave.classList.toggle("saved", saved);
  elements.detailSave.onclick = () => toggleFavorite(ticker.ticker);
  elements.detailPage.classList.add("open");
  document.body.style.overflow = "hidden";
  elements.backButton.focus();
  renderRecent();
}

function findTickerInQuestion(question) {
  const upper = question.toUpperCase();
  const aliases = [...tickerIndex.keys()].sort((left, right) => right.length - left.length);
  return aliases.find((alias) => {
    const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(^|[^A-Z0-9.])${escaped}(?=$|[^A-Z0-9.])`).test(upper);
  }) || null;
}

function interpretQuestion(rawQuestion) {
  const question = rawQuestion.trim();
  if (!question) return;
  const lower = question.toLocaleLowerCase();
  let detectedPeriod = null;
  if (/今天|今日|日報|daily/.test(lower)) detectedPeriod = "day";
  else if (/本週|這週|一週|週報|weekly|week/.test(lower)) detectedPeriod = "week";
  else if (/本月|這月|月報|monthly|month/.test(lower)) detectedPeriod = "month";
  else if (/本季|這季|季報|quarterly|quarter/.test(lower)) detectedPeriod = "quarter";
  if (detectedPeriod) state.period = detectedPeriod;

  const tickerAlias = findTickerInQuestion(question);
  const ticker = tickerAlias ? tickerIndex.get(tickerAlias) : null;
  const asksRisk = /風險|疑慮|risk|downside/.test(lower);
  if (ticker) {
    state.query = "";
    elements.queryInput.value = "";
    elements.queryStatus.textContent = `已開啟 ${ticker.ticker}${asksRisk ? " 的風險整理" : " 個股研究"}`;
    openDetail(ticker.ticker, asksRisk ? "risks" : "summary", elements.queryInput);
    return;
  }

  let sentiment = null;
  if (/偏多|看多|多頭|bullish/.test(lower)) sentiment = "Bullish";
  else if (/偏空|看空|空頭|bearish/.test(lower)) sentiment = "Bearish";
  else if (/中立|neutral/.test(lower)) sentiment = "Neutral";
  if (sentiment) {
    state.sentiment = sentiment;
    state.query = "";
    state.risk = asksRisk;
    elements.queryStatus.textContent = `已顯示${currentPeriod().label}期最新立場為${sentiment === "Bullish" ? "偏多" : sentiment === "Bearish" ? "偏空" : "中立"}的股票`;
  } else if (/收藏|自選|favorite|watchlist/.test(lower)) {
    state.favorites = true;
    state.query = "";
    elements.queryStatus.textContent = "已顯示收藏股票";
  } else {
    state.query = question;
    elements.queryStatus.textContent = `正在搜尋「${question}」`;
  }
  writeState();
  renderDashboard();
}

elements.queryForm.addEventListener("submit", (event) => {
  event.preventDefault();
  interpretQuestion(elements.queryInput.value);
});
elements.riskOnly.addEventListener("change", () => { state.risk = elements.riskOnly.checked; writeState(); renderDashboard(); });
elements.favoritesOnly.addEventListener("change", () => { state.favorites = elements.favoritesOnly.checked; writeState(); renderDashboard(); });
elements.sortSelect.addEventListener("change", () => { state.sort = elements.sortSelect.value; writeState(); renderDashboard(); });
elements.clearFilters.addEventListener("click", () => {
  state.sentiment = "All"; state.risk = false; state.favorites = false; state.sort = "latest"; state.query = "";
  elements.queryStatus.textContent = "";
  writeState(); renderDashboard();
});
elements.backButton.addEventListener("click", closeDetail);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.ticker) closeDetail();
  if (event.key === "/" && !state.ticker && document.activeElement !== elements.queryInput) {
    event.preventDefault(); elements.queryInput.focus();
  }
});
window.addEventListener("popstate", () => {
  state = readState();
  if (state.ticker) renderDetail(); else { hideDetail(); renderDashboard(); }
});

renderDashboard();
if (state.ticker) renderDetail();
</script>
</body>
</html>
